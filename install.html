<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路先知 RoadSeer 安裝</title>
<style>
  :root { --accent:#C1650A; --ink:#1a1a1a; --muted:#6b6b6b; --bg:#f5f3ef; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:460px; margin:0 auto; padding:32px 20px 48px; text-align:center; }
  .logo { font-size:30px; font-weight:800; letter-spacing:1px; }
  .sub { color:var(--muted); margin-top:4px; }
  .ver { display:inline-block; margin-top:10px; padding:3px 12px; border-radius:999px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; }
  .card { background:var(--card); border-radius:18px; padding:26px 22px; margin-top:24px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .qr { width:220px; height:220px; image-rendering:pixelated; border-radius:12px; }
  .qrhint { color:var(--muted); font-size:14px; margin-top:8px; }
  .btn { display:block; margin-top:20px; padding:16px; border-radius:14px; background:var(--accent); color:#fff; font-size:19px; font-weight:700; text-decoration:none; }
  .btn:active { opacity:.85; }
  .steps { text-align:left; margin-top:26px; background:var(--card); border-radius:14px; padding:20px 22px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .steps h3 { margin:0 0 10px; font-size:16px; }
  .steps ol { margin:0; padding-left:20px; color:#333; }
  .steps li { margin-bottom:8px; }
  .foot { color:var(--muted); font-size:13px; margin-top:24px; }
  .warn { font-size:13px; color:#a15; margin-top:6px; }
</style>
</head>

    <div class="steps">
      <h3>安裝步驟</h3>
      <ol>
        <li>用手機掃上方 QR,或點「直接下載 APK」。</li>
        <li>下載完成後點開檔案。</li>
        <li>若跳出「不允許安裝未知來源」,點<b>設定 → 允許此來源</b>再回來安裝。</li>
        <li>安裝後開啟,允許<b>定位</b>與<b>顯示在其他應用程式上層</b>權限。</li>
      </ol>
      <div class="warn">⚠ 僅供 Android · beta 測試版</div>
